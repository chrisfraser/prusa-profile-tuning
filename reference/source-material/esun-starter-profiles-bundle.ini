# PrusaSlicer config bundle — eSun starter filament profiles
# Import via: File -> Import -> Import Config Bundle
# Generated 2026-08-05. Revised 2026-08-05: the fleet is MK3S / MK4S / Core One, so the
# @MK4 presets are renamed @MK4S. Their conditions still match on /.*MK4.*/ because that
# pattern also matches an MK4S; tighten to /.*MK4S.*/ once you have read the actual
# printer_model off the machine (Lesson 16).
# Self-contained (no inherits), 0.4 mm nozzle assumptions.

[filament:eSun PETG @MK3S 0.4]
filament_vendor = eSun
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_colour = #00A040
extrusion_multiplier = 0.95
temperature = 238
first_layer_temperature = 240
bed_temperature = 90
first_layer_bed_temperature = 85
cooling = 1
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 100
disable_fan_first_layers = 3
full_fan_speed_layer = 5
slowdown_below_layer_time = 15
fan_below_layer_time = 20
min_print_speed = 15
filament_max_volumetric_speed = 8
filament_retract_length = 1.2
filament_retract_speed = 35
filament_deretract_speed = 25
filament_retract_lift = 0.4
filament_retract_before_travel = 2
filament_wipe = 1
start_filament_gcode = "M900 K0.07 ; eSun PETG LA starting value - tune with PA tower"
filament_notes = "eSun PETG starter @MK3S. TDS: 230-250C (240 rec), bed 75-90C. Runs best at cool end. Glue stick on smooth PEI mandatory; check adhesion force even on textured. Dry 65C/6-8h. Tune EM and M900 K per spool colour."
compatible_printers_condition = printer_model=~/.*MK3.*/ and nozzle_diameter[0]==0.4

